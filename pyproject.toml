"server/mcp_server.py" = ["ANN401", "BLE001", "TRY"]
"server/routes/*" = ["ANN401", "BLE001", "TRY"]
"server/search_engine.py" = ["ANN401", "BLE001", "TRY"]
"server/store.py" = ["ANN401", "BLE001", "TRY"]
"server/transcript_embeddings.py" = ["ANN401", "BLE001", "TRY"]
