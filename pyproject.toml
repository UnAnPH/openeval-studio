[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openeval-studio"
version = "0.1.0"
description = "High-performance evaluation studio & sandbox engine for frontier AI coding agents"
readme = "README.md"
requires-python = ">=3.11, <3.15"
authors = [
    { name = "Jayson Andal", email = "jaysonandal@users.noreply.github.com" }
]
dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-dotenv>=1.0.0",
    "google-genai>=1.0.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "docker>=7.1.0",
    "uv>=0.1.0",
    "inspect-ai>=0.3.260",
    "inspect-evals>=0.21.0",
    "litellm>=1.97.0",
    "duckdb>=1.0.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.1.0",
    "alembic>=1.13.0",
    "bcrypt>=4.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pyright>=1.1.350",
    "pre-commit>=3.7.0",
]

[project.scripts]
watcher = "server.doctor:main"
openeval = "cli:main"

[tool.hatch.build.targets.wheel]
packages = ["schemas", "engine", "sandbox", "server"]

[tool.pyright]
include = ["schemas", "engine", "server", "tests"]
exclude = ["tasks", "ui", ".venv", ".runs"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedVariable = true
reportUnusedImport = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["tasks", "ui", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "BLE", "ANN401", "TRY"]
ignore = ["E501", "TRY002", "TRY003", "TRY300", "TRY301"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN401", "BLE001", "TRY"]
"sandbox/*" = ["ANN401", "BLE001", "TRY"]
"cli.py" = ["ANN401", "BLE001", "TRY"]
"inspect_tasks.py" = ["ANN401", "BLE001", "TRY"]
"engine/approval_policy.py" = ["ANN401", "BLE001", "TRY"]
