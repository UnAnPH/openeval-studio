name: CI

on:
  push:
    branches: [main, master, "feat/**"]
    tags: ["prod-*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build UI bundle
        run: |
          cd ui
          npm install
          npm run build

      - name: Pytest (not slow)
        run: uv run pytest tests/ -m "not slow" -q --tb=short

      - name: Hermetic eval smoke
        run: uv run python scripts/hermetic_eval_smoke.py

      - name: Gate demo artifact
        run: bash scripts/record_gate_demo.sh

      - name: Watcher evaluate smoke (TestClient)
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient
          from server.app import app
          from server.watcher_store import get_watcher_store

          client = TestClient(app)
          get_watcher_store().reset_policy_to_defaults()

          bad = client.post(
              "/api/watcher/evaluate",
              json={
                  "tool_name": "bash",
                  "arguments": {"cmd": "sudo rm -rf /"},
                  "agent_id": "ci",
                  "session_id": "ci-smoke-1",
              },
          )
          assert bad.status_code == 200, bad.text
          body = bad.json()
          assert body["decision"] in ("deny", "escalate"), body

          good = client.post(
              "/api/watcher/evaluate",
              json={
                  "tool_name": "bash",
                  "arguments": {"cmd": "echo hello"},
                  "agent_id": "ci",
                  "session_id": "ci-smoke-2",
              },
          )
          assert good.status_code == 200, good.text
          assert good.json()["decision"] == "allow", good.json()

          sessions = client.get("/api/v1/watcher/sessions")
          assert sessions.status_code == 200
          ids = {s.get("session_id") for s in sessions.json()}
          assert "ci-smoke-1" in ids, ids
          print("CI watcher smoke OK")
          PY

  docker-security-scan:
    name: Docker Build & Trivy DevSecOps Gate
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for vulnerability scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: openeval-studio:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: openeval-studio:local
          format: "table"
          exit-code: "0" # Non-blocking on informational CVEs, outputs full security report
          severity: "CRITICAL,HIGH"

      - name: Compute Lowercase Image Metadata
        if: startsWith(github.ref, 'refs/tags/prod-')
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=${REPO_LOWER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry (GHCR)
        if: startsWith(github.ref, 'refs/tags/prod-')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Production Image to GHCR
        if: startsWith(github.ref, 'refs/tags/prod-')
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/unanph/openeval-studio:${{ steps.meta.outputs.tag }}
            ghcr.io/unanph/openeval-studio:latest
          cache-from: type=gha

  deploy:
    name: Deploy to AWS EC2 (London eu-west-2)
    needs: docker-security-scan
    if: startsWith(github.ref, 'refs/tags/prod-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          TAG: ${{ github.ref_name }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          envs: TAG
          script: |
            set -e
            cd /home/ubuntu/openeval-studio || (git clone https://github.com/unanph/openeval-studio.git /home/ubuntu/openeval-studio && cd /home/ubuntu/openeval-studio)
            git fetch --tags
            git checkout $TAG
            echo "IMAGE_TAG=$TAG" > /home/ubuntu/openeval-studio/.release-env
            docker compose --env-file /etc/openeval.env --env-file .release-env -f docker-compose.prod.yml pull
            docker compose --env-file /etc/openeval.env --env-file .release-env -f docker-compose.prod.yml up -d

