name: Deploy to AWS EC2

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    name: Continuous Deployment to AWS (London eu-west-2)
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to AWS EC2
        uses: appleboy/ssh-action@v1.0.3
        if: env.AWS_HOST != ''
        env:
          AWS_HOST: ${{ secrets.AWS_EC2_HOST }}
        with:
          host: ${{ secrets.AWS_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /home/ubuntu/openeval-studio || (git clone https://github.com/UnAnPH/openeval-studio.git /home/ubuntu/openeval-studio && cd /home/ubuntu/openeval-studio)
            git pull origin main
            docker compose -f docker-compose.aws.yml pull || true
            docker compose -f docker-compose.aws.yml up -d --build
            echo "Deployment to AWS completed successfully."
