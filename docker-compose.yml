services:
  postgres:
    image: postgres:16-alpine
    container_name: openeval-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openeval}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-openeval}
      POSTGRES_DB: ${POSTGRES_DB:-openeval}
    ports:
      - "${POSTGRES_PORT:-127.0.0.1:5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENEVAL_WATCHER_USE_LLM=${OPENEVAL_WATCHER_USE_LLM:-0}
      - WATCHER_STORAGE_DIR=/data/watcher
      - WATCHER_WEBHOOK_URL=${WATCHER_WEBHOOK_URL:-}
      - OPENEVAL_API_KEY=${OPENEVAL_API_KEY:-}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://openeval:openeval@postgres:5432/openeval}
    volumes:
      - watcher-data:/data/watcher
      - ./tasks:/app/tasks:ro
    command: ["uv", "run", "uvicorn", "server.app:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      - postgres

  ui:
    image: node:20-alpine
    working_dir: /ui
    volumes:
      - ./ui:/ui
    ports:
      - "5173:5173"
    environment:
      - VITE_API_PROXY=http://api:8000
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0 --port 5173"]
    depends_on:
      - api

volumes:
  watcher-data:
  pgdata:
