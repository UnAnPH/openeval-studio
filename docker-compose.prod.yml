services:
  openeval-live:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - OPENEVAL_DEMO_SEED=0
      - OPENEVAL_WATCHER_USE_LLM=${OPENEVAL_WATCHER_USE_LLM:-1}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENEVAL_API_KEY=${OPENEVAL_API_KEY:-}
      - ADMIN_USER=${ADMIN_USER:-jayson}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - DATABASE_URL=${DATABASE_URL:-}
      - WATCHER_STORAGE_DIR=/data/watcher
    volumes:
      - live-watcher-data:/data/watcher
      # Zero-trust container evaluation socket
      - /var/run/docker.sock:/var/run/docker.sock

  openeval-demo:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - OPENEVAL_DEMO_SEED=1
      - OPENEVAL_WATCHER_USE_LLM=0
      - WATCHER_STORAGE_DIR=/data/watcher
    volumes:
      - demo-watcher-data:/data/watcher

volumes:
  live-watcher-data:
  demo-watcher-data:
