services:
  openeval:
    image: ghcr.io/unanph/openeval-studio:${IMAGE_TAG:-latest}
    container_name: openeval-studio
    restart: unless-stopped
    ports:
      - "80:8000"
    environment:
      - PORT=8000
      - OPENEVAL_DEMO_SEED=1
      - OPENEVAL_WATCHER_USE_LLM=0
      - WATCHER_STORAGE_DIR=/var/lib/openeval
    volumes:
      - /var/lib/openeval:/var/lib/openeval
