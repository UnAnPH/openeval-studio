# Gateway tenant registry.
#
# Format: <tenantId> key=value key=value ...
# Blank lines and lines starting with '#' are ignored. Tenant order is preserved.
#
# Keys:
#   url                  the tenant's Oracle JDBC URL                  (required)
#   connectTimeoutMs     connect fail-fast budget, in milliseconds     (required)
#   mode                 URL or DATASOURCE                             (required)
#   poolSize             maximum pooled connections                    (default 10)
#   validationTimeoutMs  connection validation budget, in milliseconds (default 5000)
#   maxLifetimeMs        pooled connection lifetime, in milliseconds   (default 1800000)
#   maxRetries           per-tenant failover retry budget              (default 3)
#   maxConcurrent        per-tenant in-flight connection cap           (default 4)

tenantA  url=jdbc:oracle:thin:@//192.0.2.11:1521/svcA  connectTimeoutMs=10000 mode=URL        poolSize=5 validationTimeoutMs=5000 maxLifetimeMs=1800000 maxRetries=3 maxConcurrent=4
tenantB  url=jdbc:oracle:thin:@//192.0.2.12:1521/svcB  connectTimeoutMs=20000 mode=URL        poolSize=5 validationTimeoutMs=5000 maxLifetimeMs=1800000 maxRetries=3 maxConcurrent=4
tenantC  url=jdbc:oracle:thin:@//192.0.2.13:1521/svcC  connectTimeoutMs=15000 mode=DATASOURCE poolSize=5 validationTimeoutMs=5000 maxLifetimeMs=1800000 maxRetries=3 maxConcurrent=4
