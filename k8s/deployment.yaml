apiVersion: apps/v1
kind: Deployment
metadata:
  name: openeval-studio
  labels:
    app: openeval-studio
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: openeval-studio
  template:
    metadata:
      labels:
        app: openeval-studio
    spec:
      containers:
        - name: openeval-app
          image: ghcr.io/unanph/openeval-studio:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: openeval-config
            - secretRef:
                name: openeval-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: watcher-storage
              mountPath: /data/watcher
      volumes:
        - name: watcher-storage
          persistentVolumeClaim:
            claimName: openeval-data-pvc
